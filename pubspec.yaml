name: todododod
description: A beautifully designed to-do list mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.18.1
  flutter_animate: ^4.3.0
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.1
  http: ^1.1.0
  path_provider: ^2.1.1
  sqflite: ^2.3.0
  crypto: ^3.0.3
  path_provider_platform_interface: ^2.1.1
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^0.4.2+2
  path_provider_web: ^2.2.1
  path_provider_android: ^2.2.1
  path_provider_ios: ^2.1.1
  path_provider_linux: ^2.2.1
  path_provider_macos: ^2.1.1
  path_provider_windows: ^2.2.1
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.2.2
  shared_preferences_android: ^2.2.1
  shared_preferences_ios: ^2.3.1
  shared_preferences_linux: ^2.3.2
  shared_preferences_macos: ^2.3.2
  shared_preferences_windows: ^2.3.2
  shared_preferences_foundation: ^2.3.5
  shared_preferences_platform_interface: ^2.3.2
  flutter_keyboard_visibility: ^6.0.0
  flutter_keyboard_visibility_web: ^2.1.1
  flutter_keyboard_visibility_platform_interface: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true